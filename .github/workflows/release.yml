name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
      - name: Create build environment
        run: python -m venv .venv
      - name: Build without installing a hardware driver
        run: ./scripts/build_exe.ps1 -SkipDriverInstall
      - name: Check dependencies and compile source
        run: |
          ./.venv/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency check failed' }
          ./.venv/Scripts/python.exe -m compileall -q backend frontend shared stellaris15gen3.py stellaris15gen3_frontend.py stellaris15gen3_backend.py
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
      - name: Run mocked tests without hardware access
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./.venv/Scripts/python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Package release and checksum
        run: ./scripts/package_release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/StellarisFanControl-windows-x64.zip
            dist/StellarisFanControl-windows-x64.zip.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "$RELEASE_TAG"
